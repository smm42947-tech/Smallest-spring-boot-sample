name: CI - Spring Boot (Maven, Java 8)

on:
  push:
    branches: [ Github-Action ]
  pull_request:
    branches: [ Github-Action ]
  workflow_dispatch:

jobs:
  build-test-package:
    name: Build, Test, and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Use Java 8 to match the updated pom.xml (Spring Boot 1.2.x compatible)
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      # Build and run tests from the project folder
      - name: Build & Test
        run: mvn -B -ntp clean verify
        working-directory: SmallestSpringApp

      # Optional: create a package without tests (keeps a fast artifact step)
      - name: Package (skip tests)
        run: mvn -B -ntp -DskipTests package
        working-directory: SmallestSpringApp

      # Upload the built JAR so you can download it from the run artifacts
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: SmallestSpringApp/target/*.jar
          if-no-files-found: error
